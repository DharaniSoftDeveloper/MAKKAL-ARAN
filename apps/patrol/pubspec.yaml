name: safesight_patrol
description: MakkalAran Patrol Application - Mobile dispatch and incident response for patrol teams.
publish_to: 'none'
version: 1.4.0+106

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.0
  geolocator: ^11.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  shared_preferences: ^2.5.0
  image_picker: ^1.0.4
  intl: ^0.19.0
  url_launcher: ^6.2.0
  firebase_database: ^11.3.10
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.8
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  flutter_webrtc: ^1.6.0
  google_maps_flutter: ^2.13.1
  firebase_messaging: ^15.2.10
  supabase_flutter: ^2.8.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
